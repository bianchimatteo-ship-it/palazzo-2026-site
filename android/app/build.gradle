apply plugin: 'com.android.application'

// Release signing: the key is never in the repository. Put `storeFile`, `storePassword`, `keyAlias` and `keyPassword` in android/keystore.properties (ignored by git) or in the environment variables
// POLITICANDO_KEYSTORE_FILE, POLITICANDO_KEYSTORE_PASSWORD, POLITICANDO_KEY_ALIAS and POLITICANDO_KEY_PASSWORD. Without them a release build FAILS (see the guard below); debug builds are unaffected.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
def signingValue = { String property, String variable -> keystoreProps.getProperty(property) ?: System.getenv(variable) }
def releaseStoreFile = signingValue('storeFile', 'POLITICANDO_KEYSTORE_FILE')
def releaseStorePassword = signingValue('storePassword', 'POLITICANDO_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'POLITICANDO_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'POLITICANDO_KEY_PASSWORD')
def releaseSigningReady = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword && file(releaseStoreFile).exists()
// A release bundle without a valid key would be refused by Google Play, so building one is an ERROR, not a warning (debug builds are not affected). The message names what is missing, never a value.
def missingSigning = []
if (!releaseStoreFile) missingSigning << 'storeFile / POLITICANDO_KEYSTORE_FILE'
else if (!file(releaseStoreFile).exists()) missingSigning << 'the keystore file it points to (not found)'
if (!releaseStorePassword) missingSigning << 'storePassword / POLITICANDO_KEYSTORE_PASSWORD'
if (!releaseKeyAlias) missingSigning << 'keyAlias / POLITICANDO_KEY_ALIAS'
if (!releaseKeyPassword) missingSigning << 'keyPassword / POLITICANDO_KEY_PASSWORD'
gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.find { it.path.startsWith(project.path + ':') && it.name ==~ /^(bundle|assemble|package|sign|publish)Release.*|.*ReleaseBundle$/ }
    // Advertising coherence of a RELEASE: the shipped config (src, www and the Capacitor copy) must agree and be explicit.
    //   production + authorised  -> real ads (the intended future Release); test or off -> allowed but reported (no earnings);
    //   production WITHOUT authorisation, a malformed key, or copies that disagree -> the build is refused.
    if (releaseTask != null) {
        def adsFiles = ['../../src/data/ads-config.js', '../../www/src/data/ads-config.js', 'src/main/assets/public/src/data/ads-config.js'].collect { file(it) }.findAll { it.exists() }
        def adsMode = { String text -> (text =~ /export const APPODEAL_MODE\s*=\s*'([a-z]+)'/).with { it.find() ? it.group(1) : null } }
        def adsAuth = { String text -> (text =~ /export const APPODEAL_PRODUCTION_AUTHORIZED\s*=\s*(true|false)/).with { it.find() ? it.group(1) : null } }
        def adsKey = { String text -> (text =~ /appKey:\s*'([0-9a-f]{48})'/).find() }
        def seen = adsFiles.collect { f -> def t = f.text; [f.path, adsMode(t), adsAuth(t), adsKey(t)] }
        def problems = []
        if (seen.isEmpty()) problems << 'ads-config.js not found'
        seen.each { r ->
            if (r[1] == null || r[2] == null) problems << "${r[0]}: APPODEAL_MODE / APPODEAL_PRODUCTION_AUTHORIZED not readable"
            if (r[1] == 'production' && r[2] != 'true') problems << "${r[0]}: mode 'production' without APPODEAL_PRODUCTION_AUTHORIZED = true (it would silently run as test)"
            if (r[1] != 'production' && r[1] != 'test' && r[1] != 'off') problems << "${r[0]}: unknown APPODEAL_MODE '${r[1]}'"
            if (r[1] == 'production' && !r[3]) problems << "${r[0]}: production without a well-formed Appodeal app key"
        }
        if (seen.collect { [it[1], it[2]] }.unique().size() > 1) problems << 'src, www and the Capacitor copy disagree (run the web build and cap sync)'
        if (!problems.isEmpty()) throw new GradleException("POLITICANDO: refusing to build ${releaseTask.name}: incoherent advertising configuration: ${problems.join('; ')}")
        if (seen.any { it[1] != 'production' }) logger.warn("POLITICANDO: WARNING - the ${releaseTask.name} build is NOT in production ads mode (${seen.collect { it[1] }.unique()}): it will show test ads or none.")
    }
    if (releaseTask != null && !releaseSigningReady) {
        throw new GradleException("POLITICANDO: refusing to build ${releaseTask.name}: no valid release signing key (missing: ${missingSigning.join(', ')}). Configure android/keystore.properties or the POLITICANDO_KEY* environment variables (docs/google-play.md). Debug builds (assembleDebug) do not need it.")
    }
}

android {
    namespace = "it.matteobianchi.politicando2026"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "it.matteobianchi.politicando2026"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.0.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
