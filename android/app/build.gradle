apply plugin: 'com.android.application'

// Release signing: the key is never in the repository. Put `storeFile`, `storePassword`, `keyAlias` and `keyPassword` in android/keystore.properties (ignored by git) or in the environment variables
// POLITICANDO_KEYSTORE_FILE, POLITICANDO_KEYSTORE_PASSWORD, POLITICANDO_KEY_ALIAS and POLITICANDO_KEY_PASSWORD. Without them a release build FAILS (see the guard below); debug builds are unaffected.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
def signingValue = { String property, String variable -> keystoreProps.getProperty(property) ?: System.getenv(variable) }
def releaseStoreFile = signingValue('storeFile', 'POLITICANDO_KEYSTORE_FILE')
def releaseStorePassword = signingValue('storePassword', 'POLITICANDO_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'POLITICANDO_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'POLITICANDO_KEY_PASSWORD')
def releaseSigningReady = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword && file(releaseStoreFile).exists()
// A release bundle without a valid key would be refused by Google Play, so building one is an ERROR, not a warning (debug builds are not affected). The message names what is missing, never a value.
def missingSigning = []
if (!releaseStoreFile) missingSigning << 'storeFile / POLITICANDO_KEYSTORE_FILE'
else if (!file(releaseStoreFile).exists()) missingSigning << 'the keystore file it points to (not found)'
if (!releaseStorePassword) missingSigning << 'storePassword / POLITICANDO_KEYSTORE_PASSWORD'
if (!releaseKeyAlias) missingSigning << 'keyAlias / POLITICANDO_KEY_ALIAS'
if (!releaseKeyPassword) missingSigning << 'keyPassword / POLITICANDO_KEY_PASSWORD'
gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.find { it.path.startsWith(project.path + ':') && it.name ==~ /^(bundle|assemble|package|sign|publish)Release.*|.*ReleaseBundle$/ }
    if (releaseTask != null && !releaseSigningReady) {
        throw new GradleException("POLITICANDO: refusing to build ${releaseTask.name}: no valid release signing key (missing: ${missingSigning.join(', ')}). Configure android/keystore.properties or the POLITICANDO_KEY* environment variables (docs/google-play.md). Debug builds (assembleDebug) do not need it.")
    }
}

android {
    namespace = "it.matteobianchi.politicando2026"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "it.matteobianchi.politicando2026"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
