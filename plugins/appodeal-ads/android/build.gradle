// Library of the Capacitor plugin `AppodealAds` (Kotlin, Android only). Appodeal SDK 4.4.0 (stable) from Appodeal's own Maven repository (added in android/build.gradle).
// The ad networks are ONLY the adapters listed below, connected through Appodeal's mediation: no AdMob adapter, no Meta adapter, no InMobi adapter and no standalone InMobi SDK in the app.
// The BidMachine adapter is NOT used: it depends on the Google Mobile Ads / Ad Manager SDK (io.bidmachine:ads.networks.gam), which the project must not carry (AdMob is not connected).
ext {
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    appodealVersion = '4.4.0'
}

buildscript {
    ext.kotlin_version = project.hasProperty("kotlin_version") ? rootProject.ext.kotlin_version : '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = "it.matteobianchi.politicando.appodeal"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
    maven { url = uri("https://artifactory.appodeal.com/appodeal") }
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // Appodeal SDK (core: ads + consent manager) and the adapters of the networks connected by Appodeal's automatic connection.
    // No AdMob adapter is declared (verified with `./gradlew :app:dependencies`: no com.appodeal.ads.sdk.adapters:admob,
    // no com.google.android.gms:play-services-ads in the resolved graph). The `exclude` below is a guard against a future
    // SDK update pulling either one back in transitively; it is a no-op today.
    api("com.appodeal.ads.sdk:core:$appodealVersion") {
        exclude group: 'com.appodeal.ads.sdk.adapters', module: 'admob'
        exclude group: 'com.google.android.gms', module: 'play-services-ads'
        exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
    }
    api("com.appodeal.ads.sdk.adapters:applovin:13.6.3.0") {
        exclude group: 'com.google.android.gms', module: 'play-services-ads'
    }
    api("com.appodeal.ads.sdk.adapters:unity_ads:4.17.0.0") {
        exclude group: 'com.google.android.gms', module: 'play-services-ads'
    }
    // Appodeal's own in-house MRAID/VAST renderer (no third-party dependency: its own com.explorestack:iab has none).
    // Without it, AdNetworkRegistry has no "mraid"/"vast" entry, so the server's house-ad waterfall fallback fails
    // with ADAPTER NOT FOUND whenever a format has no real AppLovin/Unity Ads line item configured yet.
    api "com.appodeal.ads.sdk.adapters:iab:1.8.1.1"
}
