name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v6
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara il sito statico
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R src _site/src
      - name: Carica i file del sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
